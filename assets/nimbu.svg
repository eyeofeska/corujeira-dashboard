<svg xmlns="http://www.w3.org/2000/svg" width="232" height="268" class="cat" viewBox="0 0 64 74" role="img"><style>.owl, .cat { display: block; overflow: visible; }
.lids > * { transform-box: fill-box; transform-origin: 50% 0px; transform: scaleY(0); animation: 7s ease 0s infinite normal none running blink; }
@keyframes blink { 
  0%, 95% { transform: scaleY(0); }
  96.5%, 97.5% { transform: scaleY(1); }
  99%, 100% { transform: scaleY(0); }
}
.cat .fur { stroke: color-mix(in srgb, var(--x, #343A40) 22%, transparent); stroke-width: 0.6; }
.cat .tail { transform-box: view-box; transform-origin: 20px 66px; animation: 6s ease-in-out 0s infinite normal none running swish; }
@keyframes swish { 
  0%, 100% { transform: rotate(4deg); }
  50% { transform: rotate(-7deg); }
}
.cat .ear.l { transform-box: view-box; transform-origin: 24px 28px; animation: 9s ease 0s infinite normal none running flick; }
@keyframes flick { 
  0%, 60%, 64%, 100% { transform: rotate(0deg); }
  62% { transform: rotate(-12deg); }
}
.cat .head { transform-box: view-box; transform-origin: 32px 46px; animation: 11s ease-in-out 0s infinite normal none running tilt; }
@keyframes tilt { 
  0%, 84%, 100% { transform: rotate(0deg); }
  88%, 96% { transform: rotate(-5deg); }
}
.cat .mouth { transform-box: fill-box; transform-origin: 50% 0px; transform: scaleY(0); animation: 11s ease 0s infinite normal none running meow; }
.cat .shut { animation: 11s ease 0s infinite normal none running shut; }
@keyframes meow { 
  0%, 88%, 96%, 100% { transform: scaleY(0); }
  89.5%, 94.5% { transform: scaleY(1); }
}
@keyframes shut { 
  0%, 88%, 96%, 100% { opacity: 1; }
  89%, 95% { opacity: 0; }
}
.cat .mew path { opacity: 0; animation: 11s ease 0s infinite normal none running mew; }
.cat .mew path:nth-child(2) { animation-delay: 0.12s; }
.cat .mew path:nth-child(3) { animation-delay: 0.24s; }
@keyframes mew { 
  0%, 89%, 98%, 100% { opacity: 0; transform: translateX(-2px); }
  91%, 95% { opacity: 0.9; transform: translateX(0px); }
}
.cat.talk .mouth { animation: 1.3s ease 0s 1 normal none running say; }
.cat.talk .shut { animation: 1.3s ease 0s 1 normal none running sayshut; }
.cat.talk .head { animation: 1.3s ease 0s 1 normal none running saytilt; }
.cat.talk .mew path { animation: 1.3s ease 0s 1 normal none running saymew; }
.cat.talk .mew path:nth-child(2) { animation-delay: 0.1s; }
.cat.talk .mew path:nth-child(3) { animation-delay: 0.2s; }
@keyframes say { 
  0%, 100% { transform: scaleY(0); }
  15%, 70% { transform: scaleY(1); }
  85% { transform: scaleY(0); }
}
@keyframes sayshut { 
  0%, 90%, 100% { opacity: 1; }
  10%, 80% { opacity: 0; }
}
@keyframes saytilt { 
  0%, 100% { transform: rotate(0deg); }
  20%, 75% { transform: rotate(-5deg); }
}
@keyframes saymew { 
  0%, 100% { opacity: 0; transform: translateX(-2px); }
  25%, 70% { opacity: 0.9; transform: translateX(0px); }
}
@media (prefers-reduced-motion: reduce) {
  .lids > *, .cat .tail, .cat .ear, .cat .head, .cat .mouth, .cat .shut, .cat .mew path { animation: auto ease 0s 1 normal none running none; }
}</style>
